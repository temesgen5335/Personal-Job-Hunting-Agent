[project]
name = "personal-job-agent"
# Read from src/jobagent/__init__.py — one literal, no drift. See docs/VERSIONING.md.
dynamic = ["version"]
description = "Personal autonomous job-hunting agent — ingests postings from Telegram + job boards, matches them to your CV, and assists with applications. FastAPI orchestrator, Telegram bot, Astro dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]

# Core deps needed from Phase 0/1 onward. Heavier integrations live in extras
# so a minimal install (schemas + store + config) stays fast.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
telegram = ["telethon>=1.36", "python-telegram-bot>=21.0"]
apply = ["playwright>=1.44", "fpdf2>=2.7", "pypdf>=4.0"]  # ATS form-fill; fpdf2 renders the tailored CV to PDF, pypdf reads it back to verify the text layer
llm = ["openai>=1.30", "anthropic>=0.40"]  # openai SDK covers Groq/OpenRouter/OpenAI/Gemini
api = ["fastapi>=0.110", "uvicorn>=0.29", "cryptography>=42.0"]  # v2 orchestrator + encrypted config store
mcp = ["mcp>=2.2,<3"]   # the MCP operator server (src/jobagent/mcp); stdio, dual-era SDK
dev = ["pytest>=8.0", "ruff>=0.5", "pytest-asyncio>=0.23", "fastapi>=0.110", "cryptography>=42.0", "mcp>=2.2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "src/jobagent/__init__.py"
expression = "__version__"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent", "src/agentkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
